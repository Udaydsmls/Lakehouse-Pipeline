name: lakehouse
version: '1.0.0'
config-version: 2
profile: lakehouse
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
models:
  lakehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      +post-hook: "GRANT SELECT ON {{ this }} TO ROLE REPORTER"
vars:
  start_date: '2024-01-01'
  conversion_window_days: 30
