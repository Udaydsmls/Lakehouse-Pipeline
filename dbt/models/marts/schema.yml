version: 2

models:
  - name: fct_orders
    description: "One row per order with line items rolled up."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: net_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: dim_users
    description: "User profile joined with the RFM features from Spark."
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: rfm_segment
        tests:
          - accepted_values:
              values:
                - champions
                - loyal_customers
                - new_customers
                - promising
                - at_risk
                - cant_lose_them
                - hibernating
                - need_attention
      - name: ltv_estimate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: dim_products
    description: "Product catalogue with the last 30 days of engagement."
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: base_price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: mart_conversion_funnel
    description: "Daily funnel metrics and revenue."
    columns:
      - name: date
        tests: [unique, not_null]
      - name: overall_conversion_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

  - name: mart_cohort_retention
    description: "Monthly repeat-purchase retention by acquisition cohort."
    columns:
      - name: cohort_month
        tests: [not_null]
      - name: retention_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
