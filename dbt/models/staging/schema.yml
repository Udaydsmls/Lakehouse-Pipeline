version: 2

models:
  - name: stg_orders
    description: "Orders with statuses lowercased and net amount calculated."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: net_amount
        description: "total_amount minus discount_amount"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_order_items
    description: "Order line items with the line total calculated."
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]

  - name: stg_users
    description: "Users with the email domain split out and account age calculated."
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]
      - name: acquisition_channel
        tests:
          - accepted_values:
              values: ['organic', 'paid_search', 'social', 'email', 'referral', 'direct', 'unknown']

  - name: stg_products
    description: "Product catalogue with category names standardised."
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: base_price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_sessions
    description: "Browsing sessions produced by the Flink job."
    columns:
      - name: session_id
        tests: [not_null]
      - name: user_id
        tests: [not_null]
      - name: outcome
        description: "How far the session got: bounce, cart_abandoned, checkout_abandoned or purchase."
        tests:
          - accepted_values:
              values: ['bounce', 'cart_abandoned', 'checkout_abandoned', 'purchase']
