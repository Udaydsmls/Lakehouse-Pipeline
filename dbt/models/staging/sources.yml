version: 2

sources:
  - name: ecommerce
    description: "The application's Postgres tables (the OLTP source system)."
    schema: public
    tables:
      - name: orders
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: user_id
            tests: [not_null]
      - name: order_items
        columns:
          - name: order_item_id
            tests: [unique, not_null]
      - name: users
        columns:
          - name: user_id
            tests: [unique, not_null]
      - name: products
        columns:
          - name: product_id
            tests: [unique, not_null]

  - name: analytics
    description: "Tables written by the Spark batch jobs."
    schema: analytics
    tables:
      - name: user_sessions
        description: "Sessions built by the Flink job, cleaned up by Spark."
      - name: product_performance
        description: "Daily views, add-to-carts and conversion rate per product."
      - name: user_features
        description: "RFM scores and lifetime value estimates per user."
