source_type: file
name: historical-orders-csv
config:
  dataset_name: historical_orders
  format: csv
  provider:
    storage: S3
    bucket: "${S3_BUCKET}"
    path_prefix: raw/historical/
    aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
    aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
    region_name: "${AWS_REGION}"
  reader_options:
    delimiter: ","
    header: 0
    parse_dates:
      - order_date
      - updated_at
