destination_type: snowflake
name: snowflake-raw
config:
  account: "${SNOWFLAKE_ACCOUNT}"
  username: "${SNOWFLAKE_USER}"
  password: "${SNOWFLAKE_PASSWORD}"
  database: "${SNOWFLAKE_DATABASE}"
  schema: RAW
  warehouse: "${SNOWFLAKE_WAREHOUSE}"
  role: "${SNOWFLAKE_ROLE}"
  loading_method:
    method: internal_staging
    file_format: PARQUET
